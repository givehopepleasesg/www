<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIVE HOPE PLEASE — Coming Soon</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="logo-icon.png">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark-green: #093820;
      --accent-gold: #E3A010;
      --text-white: #FFFFFF;
      --text-light: #E5E7EB;
      --font-main: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-main);
      color: var(--text-light);
      background-color: var(--bg-dark-green);
      background-image: linear-gradient(rgba(9, 56, 32, 0.88), rgba(9, 56, 32, 0.88)), url('give-hope-please-bg.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
    }

    .container {
      max-width: 600px;
      background-color: rgba(13, 56, 33, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 40px 30px;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .logo-img {
      height: 70px;
      width: auto;
      margin-bottom: 20px;
      object-fit: contain;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text-white);
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .highlight {
      color: var(--accent-gold);
    }

    .motto {
      font-size: 0.95rem;
      color: var(--accent-gold);
      font-weight: 600;
      margin-bottom: 24px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .divider {
      height: 1px;
      background-color: rgba(255, 255, 255, 0.15);
      margin: 20px auto;
      width: 80%;
    }

    p {
      font-size: 0.95rem;
      color: var(--text-light);
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .contact {
      font-size: 0.88rem;
      color: var(--text-light);
      opacity: 0.8;
    }

    .contact a {
      color: var(--accent-gold);
      text-decoration: none;
      font-weight: 600;
    }

    .contact a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="logo-icon.png" alt="Give Hope Please Logo" class="logo-img" onerror="this.style.display='none'">
    
    <h1>GIVE <span class="highlight">HOPE</span> PLEASE</h1>
    <div class="motto">Website Under Construction</div>

    <div class="divider"></div>

    <p>
      We are currently updating our official website to better serve our community and beneficiaries. 
      Please check back soon!
    </p>

    <div class="contact">
      For urgent inquiries, please reach out to us at:<br>
      <a href="mailto:info@givehopeplease.org">info@givehopeplease.org</a>
    </div>
  </div>

</body>
</html>
